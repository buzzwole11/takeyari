<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060c14">
<!-- iPhone でホーム画面に追加したとき、全画面のアプリのように開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="竹槍防空">
<title>竹槍防空</title>
<style>
  :root {
    --paper: #f1ead6;
    --muted: #9fb0b3;
    --gold: #f2c46d;
    --cyan: #8fe0d6;
    --red: #f07c68;
    --ink: #060c14;
    --line: rgba(230, 236, 230, 0.18);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--paper);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; overscroll-behavior: none; touch-action: manipulation;   /* iPhone の長押しメニュー・引っぱり更新・ダブルタップ拡大を止める */
  }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .mincho { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* 穴あき銭 */
  .coin { display: inline-block; width: 0.95em; height: 0.95em; border-radius: 50%; vertical-align: -0.12em; margin-right: 0.18em;
    background: radial-gradient(circle at 35% 30%, #fff1c2, #e9b44c 45%, #a8741f); box-shadow: 0 0 6px rgba(242, 196, 109, 0.6); position: relative; }
  .coin::after { content: ""; position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; background: #3a2a10; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .top {
    position: absolute; top: 0; left: 0; right: 0;
    padding: max(14px, env(safe-area-inset-top)) 14px 24px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    background: linear-gradient(rgba(4, 9, 16, 0.7), transparent);
  }
  #stage-tag { font-size: 22px; letter-spacing: 0.06em; }
  #stage-name { font-size: 13px; color: var(--gold); margin-top: 2px; }
  #objective { font-size: 18px; margin-top: 6px; }
  .right { text-align: right; min-width: 120px; }
  #money { font-size: 22px; color: var(--gold); }
  .hpbar { margin-top: 8px; height: 8px; background: rgba(255, 255, 255, 0.12); border-radius: 4px; overflow: hidden; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: var(--cyan); transition: width 120ms; }
  .hp-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; }
  .hp-row .hpbar { flex: 1; margin: 0; }
  #pause-btn { pointer-events: auto; margin-top: 10px; width: 40px; height: 40px; font-size: 16px; background: rgba(8, 18, 26, 0.6); border: 1px solid var(--line); border-radius: 50%; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 16px max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; }
  #ammo { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; max-width: 55%; }
  #ammo i { display: block; width: 6px; height: 24px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 8px rgba(242, 196, 109, 0.5); }
  #ammo i.empty { background: rgba(242, 196, 109, 0.18); box-shadow: none; }
  #combo { font-size: 24px; color: var(--gold); font-style: italic; font-weight: 800; text-shadow: 0 0 16px rgba(242, 160, 60, 0.7); opacity: 0; transition: opacity 150ms; }
  .br { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  /* 竹嵐のボタン。まわりの輪がゲージで、満ちると光って押せる */
  #storm { --e: 0; pointer-events: auto; width: 68px; height: 68px; border-radius: 50%; border: 0; padding: 0; position: relative;
    background: conic-gradient(var(--gold) calc(var(--e) * 1%), rgba(255, 255, 255, 0.14) 0); opacity: 0.75; }
  #storm span { position: absolute; inset: 5px; border-radius: 50%; background: #0c1620; display: grid; place-items: center; font-size: 30px; color: rgba(241, 234, 214, 0.45); }
  #storm.ready { opacity: 1; animation: ready 0.8s ease-in-out infinite; box-shadow: 0 0 22px rgba(242, 196, 109, 0.8); }
  #storm.ready span { color: var(--gold); background: #2a1c06; }
  @keyframes ready { 50% { transform: scale(1.12); } }
  #wind { position: absolute; top: 116px; left: 14px; font-size: 20px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 10px rgba(143, 224, 214, 0.6); }

  #banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; opacity: 0; transform: translateY(10px); transition: opacity 260ms, transform 260ms; }
  #banner.show { opacity: 1; transform: none; }
  #banner .num { font-size: 40px; letter-spacing: 0.2em; color: var(--paper); text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9); }
  #banner .name { font-size: 44px; letter-spacing: 0.1em; margin-top: 4px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9); }
  #siren { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 15px; letter-spacing: 0.5em; color: var(--red); opacity: 0; text-shadow: 0 0 14px rgba(240, 80, 60, 0.8); }
  #siren.on { animation: blink 0.5s steps(2) 6; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
  #redflash { position: fixed; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(transparent 55%, rgba(200, 30, 20, 0.35)); opacity: 0; }
  #redflash.on { animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

  /* 照準（親指の少し上） */
  #reticle { position: fixed; width: 150px; height: 150px; margin: -75px 0 0 -75px; pointer-events: none; z-index: 6; opacity: 0; }
  #reticle circle { fill: none; stroke-width: 4; }
  #reticle .bg { stroke: rgba(255, 255, 255, 0.18); }
  #reticle .fg { stroke: var(--cyan); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  #reticle .pz { stroke: rgba(242, 196, 109, 0.55); transform: rotate(-90deg); transform-origin: 50% 50%; }
  #reticle .x { stroke: rgba(255, 255, 255, 0.8); stroke-width: 2; }
  #reticle.perfect .fg { stroke: var(--gold); filter: drop-shadow(0 0 6px var(--gold)); }
  #reticle.lock .x { stroke: var(--red); }
  #thumb { position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); pointer-events: none; z-index: 6; opacity: 0; }

  .float { position: fixed; z-index: 7; pointer-events: none; font-weight: 800; white-space: nowrap; transform: translate(-50%, -50%); -webkit-text-stroke: 3px rgba(40, 20, 4, 0.85); paint-order: stroke fill; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9); }
  .hpb { position: fixed; z-index: 6; width: 46px; height: 5px; margin-left: -23px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 3px; overflow: hidden; pointer-events: none; }
  .hpb i { display: block; height: 100%; background: #ff6a4a; }
  .coin.fly { position: fixed; z-index: 8; pointer-events: none; font-size: 14px; margin: 0; transition: left 520ms cubic-bezier(.5, -0.3, .7, 1), top 520ms cubic-bezier(.3, 0, .6, 1), opacity 520ms, transform 520ms; }
  #money.bump, #combo.bump { animation: bump 0.25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.25); } }
  #ammo.nope { animation: nope 0.25s linear; }
  @keyframes nope { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  #hurt { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; box-shadow: inset 0 0 90px 30px rgba(230, 40, 20, 0.75); }
  #hurt.on { animation: hurt 0.5s ease-out; }
  @keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }
  /* 串刺し・竹嵐の判子 */
  #stamp { position: fixed; left: 0; right: 0; top: 30%; z-index: 7; pointer-events: none; text-align: center; font-size: 54px; font-weight: 700; letter-spacing: 0.08em; color: #fff3d6; opacity: 0;
    text-shadow: 0 0 22px rgba(255, 150, 50, 0.95), 0 4px 0 rgba(120, 30, 10, 0.9), 0 6px 30px rgba(0, 0, 0, 0.9); }
  #stamp.gold { color: var(--gold); font-size: 62px; }
  #stamp.on { animation: stamp 1.25s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes stamp { 0% { opacity: 0; transform: scale(2.6) rotate(-8deg); } 14% { opacity: 1; transform: scale(1) rotate(-4deg); } 75% { opacity: 1; transform: scale(1.04) rotate(-4deg); } 100% { opacity: 0; transform: scale(1.1) rotate(-4deg) translateY(-14px); } }

  /* 画面 */
  .screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); text-align: center; overflow-y: auto; }
  #menu { background: linear-gradient(rgba(4, 9, 16, 0.1), rgba(4, 9, 16, 0.2) 35%, rgba(4, 9, 16, 0.9)); justify-content: flex-end; }
  #menu h1 { font-size: 64px; line-height: 1; margin: 0 0 12px; letter-spacing: 0.06em; font-weight: 500; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.8); }
  #menu h1 span { display: block; color: var(--gold); }
  .primary { width: min(330px, 100%); padding: 15px 20px; font-size: 20px; font-weight: 800; letter-spacing: 0.1em; border: 0; border-radius: 8px; background: var(--gold); color: #1b1407; box-shadow: 0 8px 30px rgba(242, 196, 109, 0.3); margin-top: 10px; }
  .reward { width: min(330px, 100%); padding: 11px 18px; font-size: 16px; font-weight: 800; border: 1px solid rgba(143, 224, 214, 0.55); border-radius: 8px; background: rgba(20, 60, 64, 0.85); color: var(--cyan); margin-top: 8px; }
  .small { padding: 8px 14px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: rgba(8, 18, 26, 0.7); margin-top: 8px; color: var(--muted); }
  .wallet { font-size: 22px; color: var(--gold); margin: 12px 0 2px; }

  .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(340px, 100%); margin-top: 10px; }
  .shop button { position: relative; padding: 8px 2px 7px; border: 1px solid var(--line); border-radius: 10px; background: rgba(10, 22, 30, 0.85); line-height: 1.25; min-height: 82px; }
  .shop button .ic { display: block; font-size: 34px; margin-top: 4px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .shop button .nm { display: block; font-size: 12px; color: var(--muted); }
  .shop button .lv { position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--muted); }
  .shop button .cs { display: block; font-size: 13px; color: var(--gold); margin-top: 3px; }
  .shop button.can { border-color: rgba(242, 196, 109, 0.75); box-shadow: 0 0 12px rgba(242, 196, 109, 0.35), inset 0 0 10px rgba(242, 196, 109, 0.12); animation: glow 1.4s ease-in-out infinite; }
  .shop button.pop { animation: popup 0.35s ease-out; }
  .shop button:disabled { opacity: 0.55; }
  .shop button.lock .ic { filter: blur(0.6px); opacity: 0.6; }
  @keyframes glow { 50% { box-shadow: 0 0 18px rgba(242, 196, 109, 0.6), inset 0 0 14px rgba(242, 196, 109, 0.2); } }
  @keyframes popup { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

  #result { background: rgba(4, 9, 16, 0.78); }
  .res-head { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
  #res-stage { font-size: 15px; color: var(--gold); letter-spacing: 0.2em; }
  #res-title { font-size: 34px; margin: 0; font-weight: 500; letter-spacing: 0.1em; }
  #poster { width: min(330px, 100%); aspect-ratio: 600 / 330; border-radius: 4px; margin-top: 8px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
  #stars { font-size: 40px; letter-spacing: 6px; margin-top: 4px; line-height: 1.1; }
  #stars span { display: inline-block; color: rgba(255, 255, 255, 0.15); }
  #stars span.on { color: var(--gold); text-shadow: 0 0 18px rgba(242, 196, 109, 0.9); animation: star 0.45s cubic-bezier(.3, 1.8, .5, 1) both; }
  #stars span.on:nth-child(2) { animation-delay: 0.25s; }
  #stars span.on:nth-child(3) { animation-delay: 0.5s; }
  @keyframes star { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
  #res-gain { font-size: 34px; color: var(--gold); margin-top: 2px; }
  svg.ic { width: 1em; height: 1em; vertical-align: -0.12em; }
  .hp-row .ic { width: 17px; height: 17px; color: var(--cyan); flex: none; }
  #boss-bar { position: absolute; top: 150px; left: 16px; right: 16px; display: flex; align-items: center; gap: 8px; color: var(--gold); font-size: 22px; }
  #boss-bar .hpbar { flex: 1; margin: 0; height: 10px; border: 1px solid rgba(242, 196, 109, 0.5); }
  #boss-fill { height: 100%; background: linear-gradient(90deg, #ff6a4a, var(--gold)); transition: width 120ms; }
  #tip { position: absolute; left: 0; right: 0; bottom: 128px; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.9); }
  #hint { position: fixed; z-index: 6; pointer-events: none; }
  #hint i { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 14px rgba(242, 196, 109, 0.7); animation: hintring 1.1s ease-in-out infinite; }
  #hint svg { position: absolute; left: -6px; top: 4px; width: 46px; height: 58px; animation: hinthand 1.1s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6)); }
  @keyframes hintring { 0%, 100% { transform: scale(1.25); opacity: 0.2; } 45%, 80% { transform: scale(0.8); opacity: 1; } }
  @keyframes hinthand { 0%, 100% { transform: translate(10px, 14px); } 45%, 80% { transform: none; } }
  .opts { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; display: flex; gap: 8px; }
  .opts.static { position: static; margin-top: 18px; }
  .opt { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(8, 18, 26, 0.6); padding: 10px; color: var(--paper); position: relative; }
  .opt svg { width: 100%; height: 100%; display: block; }
  .opt.off { color: rgba(241, 234, 214, 0.3); }
  .opt.off::after { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; background: var(--red); transform: rotate(-45deg); }
  #road { display: flex; gap: 6px; width: min(340px, 100%); margin-bottom: 12px; }
  .road-chip { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 5px 2px 4px; font-size: 11px; color: var(--muted); background: rgba(10, 22, 30, 0.75); line-height: 1.3; }
  .road-chip b { display: block; font-size: 15px; color: var(--paper); font-weight: 700; }
  .road-chip.next { border-color: rgba(242, 196, 109, 0.8); color: var(--gold); }
  .road-chip.done { opacity: 0.4; }
  .reward.slim { padding: 8px 14px; font-size: 14px; }
  .reward:disabled { opacity: 0.35; }
  .shop.free button { border-color: rgba(143, 224, 214, 0.8); }
  .shop.free button .cs { color: var(--cyan); }
  #pause { background: rgba(4, 9, 16, 0.78); justify-content: center; }
  .pause-title { font-size: 30px; letter-spacing: 0.3em; margin-bottom: 22px; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #res-road { color: var(--cyan); font-size: 17px; margin-top: 2px; letter-spacing: 0.08em; }
  #gift { background: rgba(4, 9, 16, 0.82); justify-content: center; z-index: 12; }
  .gift-card { width: min(320px, 100%); border: 1px solid rgba(242, 196, 109, 0.5); border-radius: 14px; background: rgba(12, 24, 34, 0.97); padding: 20px 18px; }
  .gift-ic { width: 54px; height: 54px; color: var(--gold); }
  #gift-lines div { display: flex; justify-content: space-between; font-size: 15px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  #gift-sum { font-size: 40px; color: var(--gold); margin-top: 10px; }
  .tabs { display: flex; align-items: center; gap: 6px; width: min(340px, 100%); margin-top: 12px; }
  .tab { padding: 7px 13px; font-size: 14px; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; background: rgba(8, 18, 26, 0.7); color: var(--muted); }
  .tab.on { background: var(--gold); color: #1b1407; border-color: var(--gold); }
  .tabs .wallet { margin: 0 2px 0 auto; font-size: 20px; }
  .member { display: flex; flex-direction: column; gap: 4px; }
  .member button { min-height: 0; }
  .member [data-team] { min-height: 52px; padding: 4px 2px; }
  .member [data-team] .ic { font-size: 26px; margin-top: 0; display: inline-block; }
  .member [data-team] .tm { display: inline-block; font-size: 11px; color: var(--muted); margin-left: 4px; vertical-align: 4px; }
  .member.on [data-team] { border-color: var(--cyan); background: rgba(20, 60, 64, 0.85); }
  .member.on [data-team] .tm { color: var(--cyan); }
  .member [data-crewup] { padding: 4px 2px; font-size: 12px; color: var(--gold); }
  #shop-say { width: min(340px, 100%); margin-top: 8px; font-size: 14px; color: var(--paper); min-height: 20px; }
  #look-shop { width: min(340px, 100%); }
  #look-shop .lab { text-align: left; font-size: 13px; color: var(--gold); margin: 8px 2px 4px; letter-spacing: 0.2em; }
  .looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .looks button { padding: 5px 2px; border: 1px solid var(--line); border-radius: 8px; background: rgba(10, 22, 30, 0.85); line-height: 1.25; }
  .looks button i { display: block; height: 7px; width: 70%; margin: 2px auto 3px; border-radius: 4px; }
  .looks button .nm { display: block; font-size: 13px; color: var(--paper); }
  .looks button .cs { display: block; font-size: 11px; color: var(--gold); }
  .looks button.on { border-color: var(--cyan); }
  .looks button.on .cs { color: var(--cyan); }
  .looks button:disabled { opacity: 0.55; }
  .looks button { position: relative; padding-top: 16px; }
  .looks button em, #pull em { position: absolute; top: 3px; left: 6px; font-style: normal; font-size: 10px; color: var(--muted); }
  .looks .r1, #pull.r1 { border-color: rgba(143, 224, 214, 0.55); }
  .looks .r2, #pull.r2 { border-color: rgba(242, 196, 109, 0.7); }
  .looks .r1 em, #pull.r1 em { color: var(--cyan); }
  .looks .r2 em, #pull.r2 em { color: var(--gold); }
  .looks button.on { box-shadow: 0 0 12px rgba(143, 224, 214, 0.5); border-color: var(--cyan); }
  .looks button.new { animation: popup 0.4s ease-out; }
  #look { background: rgba(4, 9, 16, 0.86); justify-content: flex-start; }
  .look-head { display: flex; justify-content: space-between; align-items: center; width: min(340px, 100%); }
  .look-head .small { margin: 0; }
  .tabs.center { margin: 14px 0 12px; }
  #look-count { margin-left: auto; font-size: 13px; color: var(--muted); }
  #look-grid { width: min(340px, 100%); }
  #pull { position: relative; width: min(340px, 100%); margin-top: 14px; padding: 18px 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: rgba(12, 24, 34, 0.95); opacity: 0; transform: scale(0.6) rotate(-6deg); }
  #pull.in { opacity: 1; transform: none; transition: all 320ms cubic-bezier(.2, 1.6, .4, 1); }
  #pull i { display: block; height: 12px; width: 60%; margin: 0 auto 8px; border-radius: 6px; }
  #pull b { display: block; font-size: 30px; letter-spacing: 0.1em; }
  #pull span { font-size: 13px; color: var(--gold); }
  #pull.r2 { box-shadow: 0 0 26px rgba(242, 196, 109, 0.6); }
  #gacha-btn { margin-top: 14px; }
  #gacha-btn:disabled { opacity: 0.4; }
  .odds { font-size: 11px; color: var(--muted); margin-top: 8px; }
  #rank-open { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; margin: 0; font-size: 17px; padding: 9px 16px; color: var(--gold); border-color: rgba(242, 196, 109, 0.5); letter-spacing: 0.2em; }
  #rank { background: rgba(4, 9, 16, 0.9); justify-content: flex-start; overflow: hidden; }
  .rank-title { font-size: 28px; letter-spacing: 0.4em; color: var(--gold); }
  .rank-nm { display: flex; gap: 6px; width: min(340px, 100%); margin-top: 14px; }
  .rank-nm input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 9px 12px; color: var(--paper); background: rgba(10, 22, 30, 0.9); border: 1px solid var(--line); border-radius: 8px; -webkit-user-select: text; user-select: text; }
  .rank-nm .small { margin: 0; color: var(--paper); }
  #rank-me { width: min(340px, 100%); margin: 10px 0 6px; font-size: 14px; color: var(--cyan); min-height: 20px; }
  #rank-list { width: min(340px, 100%); flex: 1 1 0; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); }
  #rank-list .msg { padding: 30px 0; color: var(--muted); }

for (const u of UPS) save.up[u.id] = 0;
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
  if (Number.isFinite(s.coins)) save.coins = Math.max(0, Math.floor(s.coins));

  if (Number.isFinite(s.best)) save.best = Math.max(1, Math.floor(s.best));
  for (const u of UPS) if (Number.isFinite(s.up?.[u.id])) save.up[u.id] = clamp(Math.floor(s.up[u.id]), 0, u.max ?? 99);
  if (s.fails && typeof s.fails === "object") save.fails = s.fails;
  if (s.stars && typeof s.stars === "object") save.stars = s.stars;
  if (s.opt && typeof s.opt === "object") { save.opt.sound = s.opt.sound !== false; save.opt.vibe = s.opt.vibe !== false; }
  for (const k of ["tut", "road", "skin", "last", "streak"]) if (Number.isFinite(s[k])) save[k] = Math.max(0, Math.floor(s[k]));
  for (const k of ["day", "gift2"]) if (typeof s[k] === "string") save[k] = s[k];
  if (typeof s.free?.day === "string" && Number.isFinite(s.free.n)) save.free = { day: s.free.day, n: s.free.n };
  // 仲間と見た目。古い保存（「援」の強化、道でもらった竹槍の色）は引き継ぐ
  const ints = (a, n) => (Array.isArray(a) ? [...new Set(a.filter((x) => Number.isInteger(x) && x >= 0 && x < n))] : []);
  if (s.crew && typeof s.crew === "object") { for (const k of ["grandma", "grandpa", "kid", "fire", "monk", "pilot"]) if (Number.isFinite(s.crew[k]) && s.crew[k] > 0) save.crew[k] = Math.floor(s.crew[k]); }
  else if (s.up?.allies > 0) { save.crew.grandma = Math.floor(s.up.allies); if (s.up.allies >= 4) save.crew.grandpa = Math.floor(s.up.allies) - 3; }

  if (s.own && typeof s.own === "object") { save.own.spear = [...new Set([0, ...ints(s.own.spear, 10)])]; save.own.crew = [...new Set([0, ...ints(s.own.crew, 8)])]; }

} catch { /* 壊れていても遊べる */ }
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };
// 番付（ネットのランキング）。預けるのは名前・越えた面の数・端末ごとの乱数IDだけ。つながらなくても遊べる

const rankPost = (path, body) => fetch(RANK_URL + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");

  } catch { list.innerHTML = '<div class="msg">つながりません。あとでもう一度</div>'; }
}
const L = (id) => save.up[id];

// 強化の効き目（1段ごとの差は小さく、段数を多く）
const dmgMul = () => 1 + 0.1 * L("spear");
const extraPierce = () => Math.min(3, Math.floor(L("spear") / 4));

const chargeK = () => Math.pow(0.97, L("breath"));
const perfectWin = () => { const k = chargeK(); const a = 0.5 * k; return [a, a + 0.3 * k + 0.018 * L("breath")]; };

const upCost = (u) => Math.round(u.base * Math.pow(1.32, L(u.id)));

// ---------------- 仕掛け（ベーコン型） ----------------
// 並び順がそのまま第1面〜第30面。毎面ひとつ、新しいものが出る
const GIMMICKS = {
  basic: "接近する影", column: "一列縦隊", triple: "三本槍", bombs: "落下弾", clouds: "雲隠れ",
  grandma: "祖母参戦", boss: "指揮機", fighter: "護衛戦闘機", wind: "強風", decoy: "紙の囮",
  pole: "物干し竿", fullmoon: "満月", lowfly: "超低空", gull: "逆ガル翼", fire: "火の竹槍",

};
// 小型機の性格。面で初めて出たあとは、ふつうの面にも護衛として混ざる
const ESC = {
  // zig は横にくねる幅、wav は上下にうねる幅。戦闘機は速く、まっすぐ飛ばない
  fighter: { model: "fighter", hp: 1.4, speed: 2.5, drops: 0, zig: 95, wav: 34 },

const FIRST = Object.keys(GIMMICKS);

const FORMS = ["column", "vee", "swarm", "mirror", "letters", "zigzag", "basic", "swarm"];
const MODS = ["clouds", "wind", "rain", "dark", "fullmoon", "dawn", "lowfly", "triple", "fire", "pole", "daikon", "fireworks", "decoy", "armor", "roofmove", "gold"];

function stageDef(n) {
  let set;
  if (n <= FIRST.length) set = [FIRST[n - 1]];
  else {
    set = [FORMS[(n * 5) % FORMS.length], MODS[(n * 7) % MODS.length]];
    if (set[0] === "basic") set.shift();

    else if (n % 4 === 0) set.push("bombs");

  const g = new Set(set);

  if (g.has("final")) for (const k of ["giant", "column", "bombs"]) g.add(k);

function wingTarget(w) {

function updateWingmen(dt) {
  for (const w of wingmen) {

      if (!planes.some((p) => alive(p) && !p.paper && !p.away)) { w.wait = 0.8; continue; }
      if (allies.some((a) => a.kind === "pilot" && a.out)) { w.wait = 1; continue; }   // 飛行兵が退避しているあいだは呼べない
      const side = Math.random() < 0.5 ? -1 : 1;

      w.shots = 1 + (w.tier >= 2 ? 1 : 0) + (w.tier >= 4 ? 1 : 0);   // 新しい機種ほど、1回の出撃で多く撃つ
      w.cool = 0;
      w.target = wingTarget(w);

      w.mesh.scale.setScalar(2.9);
      audio.flyby(w.tier);
    }
    w.cool -= dt;
    // 狙っていた敵が先に落ちたら、すぐ次の敵へ向き直る
    if (w.shots > 0 && !(w.target && alive(w.target))) w.target = wingTarget(w);

    if (t) {

      w.vel.lerp(tmpV.multiplyScalar(w.speed / d), Math.min(1, dt * 3.5));

        // 曳光弾の一連射

        for (let k = 0; k < 14; k++) fx.emit(tmpV2.copy(w.pos).lerp(t.pos, k / 14), ZERO, COL.gold, 5, 0.18 + k * 0.012, { drag: 0 });

    w.pos.addScaledVector(w.vel, dt);
    w.mesh.position.copy(w.pos);
    w.mesh.lookAt(tmpV.copy(w.pos).add(w.vel));
    w.mesh.rotateZ(-w.vel.x * 0.003);

  }
}

const LETTERS = [
  ["..X..", "..X..", "XXXXX", "..X..", "..X.."],   // 十

function buildQueue(d) {
  const q = [], g = d.g;
  const span = Math.min(34, 4 + d.count * 1.9);   // 出現は長くても34秒のうちに終える
  const small = { size: 0.5, hp: 0.5, speed: 1.5, drops: 0, small: true };
  if (g.has("column")) {
    const groups = Math.max(2, Math.round(d.count / 4));
    for (let k = 0; k < groups; k++) {
      const x = rand(-200, 200), y = rand(130, 220);
      for (let i = 0; i < 4; i++) q.push({ at: 1.5 + k * (span / groups) + i * 0.9, x, y: y + i * 14, z: -740 - i * 90 });
    }
  } else if (g.has("vee")) {
    const groups = Math.max(2, Math.round(d.count / 5));
    for (let k = 0; k < groups; k++) {
      const x = rand(-100, 100), y = rand(140, 200), at = 1.5 + k * (span / groups);
      for (let i = 0; i < 5; i++) { const w = Math.ceil(i / 2), s = i % 2 ? 1 : -1; q.push({ at, x: x + s * w * 110, y: y + w * 10, z: -720 - w * 95, vx: 0 }); }
    }
  } else if (g.has("letters")) {
    LETTERS.forEach((rows, k) => rows.forEach((row, r) => [...row].forEach((ch, c) => {
      if (ch === "X") q.push({ at: 1.5 + k * 10, x: (c - 2) * 96, y: 300 - r * 50, z: -780, vx: 0, ...small, size: 0.55, speed: 0.75 });
    })));
  } else if (g.has("swarm")) {
    const horde = g.has("horde");
    const groups = horde ? 14 : Math.max(3, Math.round(d.count * 0.6)), per = horde ? 6 : 5;
    for (let k = 0; k < groups; k++) {
      const x = rand(-170, 170), y = rand(130, 230), at = 1.5 + k * ((horde ? 30 : span) / groups);
      for (let i = 0; i < per; i++) q.push({ at: at + i * 0.18, x: x + rand(-70, 70), y: y + rand(-40, 40), z: -760 - i * 30, ...small });
    }
  } else if (g.has("mirror")) {
    // 頭の上を越えて、背中から遠ざかっていく。逃げ切られる前に落とす
    for (let i = 0; i < d.count; i++) q.push({ at: 1.3 + (i * span) / d.count + rand(0, 0.6), away: true, x: rand(-150, 150), y: rand(150, 230), z: -70 });
  } else {
    const main = Object.keys(ESC).find((k) => g.has(k));
    const nb = main ? Math.ceil(d.count / 3) : d.count;
    for (let i = 0; i < nb; i++) q.push({ at: 1.3 + (i * span) / nb + rand(0, 0.6) });
    // 小型機が主役の面は、2機ずつ組んで来る
    if (main) for (let i = 0; i < d.count + 2; i++) {
      const k = Math.floor(i / 2), side = i % 2 ? 1 : -1;
      q.push({ at: 1.3 + (k * span) / ((d.count + 2) / 2) + (i % 2) * 0.35, x: rand(-120, 120) + side * 70, ...ESC[main] });
    }
  }
  const known = Object.keys(ESC).filter((k) => FIRST.indexOf(k) + 1 < d.n);
  if (known.length && !g.has("letters") && !g.has("mirror") && !g.has("horde")) for (let i = 0; i < Math.round(d.count * 0.3); i++) q.push({ at: 3 + rand(0, span), ...ESC[pick(known)] });
  if (g.has("rush") && !g.has("swarm") && !g.has("letters")) {
    const groups = Math.min(7, 4 + Math.floor(d.n / 12));
    for (let k = 0; k < groups; k++) {
      const x = rand(-170, 170), y = rand(130, 230), at = 3 + k * (span / groups);
      for (let i = 0; i < 6; i++) q.push({ at: at + i * 0.16, x: x + rand(-80, 80), y: y + rand(-45, 45), z: -760 - i * 30, ...small });
    }
  }
  if (g.has("zigzag")) for (const e of q) e.zig = rand(70, 110);
  if (g.has("decoy")) for (let i = 0; i < Math.ceil(d.count / 2); i++) q.push({ at: 3 + rand(0, span), kind: "paper" });
  if (g.has("gold")) for (let i = 0; i < (d.n <= FIRST.length ? 3 : 1); i++) q.push({ at: 3 + (span * (i + 1)) / 4, gold: true, speed: 1.8, hp: 3, drops: 0, y: rand(170, 240) });
  if (g.has("giant")) q.push({ at: g.has("final") ? 9 : 4, kind: "boss", giant: true, size: 3, hp: 70, speed: 0.42, drops: 10, y: 320, x: 0, vx: 0 });
  else if (g.has("boss")) q.push({ at: 4, kind: "boss" });
  for (const e of q) e.at = Math.max(0.3, e.at - 0.9);   // 奥から入ってくる時間のぶん、早めに出す
  return q.sort((a, b) => a.at - b.at);
}

function futurePos(t, T) {
  const P = t.pos.clone();
  if (t.app > 0) {
    const aT = def.n === 1 ? 1.1 : 2.6, u0 = 1 - t.app, u1 = Math.min(1, u0 + T / aT);
    P.z += FAR * ((1 - (1 - u1) ** 2) - (1 - (1 - u0) ** 2));

  let T = start.distanceTo(P) / speed;
  for (let k = 0; k < 4; k++) {

    if (target?.bomb) P.y -= 0.5 * 60 * T * T;
    T = start.distanceTo(P) / speed;

  const vel = P.clone().sub(start).divideScalar(T);
  vel.y += 0.5 * grav * T;
  vel.x -= 0.5 * (def?.wind || 0) * T * 0.8;

// ---------------- 更新 ----------------
function update(dt, real) {
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 1600) c.position.x = -1600; }
  const now = performance.now() / 1000;
  updateFires(dt, now);
  updateSearchlights(dt, now);
  // 家族の腕の振り（待機中も少し揺れる）
  for (const a of allies) {
    a.swing = Math.max(0, a.swing - dt * 3);
    const arm = a.person.userData.arm;
    arm.rotation.x = a.swing > 0 ? -2.6 * Math.sin(a.swing * Math.PI) : Math.sin(now * 2 + a.timer) * 0.08;
    a.person.userData.spear.visible = !a.person.userData.thrower || a.swing < 0.5;
    if (a.person.userData.bell) a.person.userData.bell.rotation.z = Math.sin(a.swing * 9) * a.swing * 0.35;
  }
  propTex.rotation += dt * 31;
  updateDebris(dt);

  if (mode !== "play") { fx.update(dt); smoke.update(dt); return; }
  st.t += dt;
  while (st.queue.length && st.queue[0].at <= st.t) spawn(st.queue.shift());

  if (def.g.has("rain") && (st.boltT -= dt) <= 0) { st.boltT = rand(3.5, 7); bolt = 1; audio.thunder(); }
  if (st.ammo < ammoCap()) { st.reload += dt; if (st.reload >= reloadTime()) { st.reload = 0; st.ammo++; } }
  if (input.charging) {
    input.t += real;
    const [p0, p1] = perfectWin();
    if (input.t >= p0 && input.t <= p1 && !input.cue) { input.cue = true; audio.ui(); haptic(8); }
  }
  if (st.volleyLeft > 0) {
    st.volleyT -= real;
    if (st.volleyT <= 0) {
      const ts = [...bombs, ...planes].filter((t) => reach(t) && !t.paper);
      if (ts.length) {
        throwSpear(0, 0, 1, true, { storm: true, target: ts[st.volleyN % ts.length] });
        st.volleyN++; st.volleyLeft--; st.volleyT = 0.085;
      } else st.volleyLeft = 0;
    }
  }

  updateWingmen(dt);
  updateAllies(dt);

  for (const p of planes) {
    if (p.age < 0.6) { p.age += dt; p.mesh.scale.setScalar(p.size * Math.min(1, p.age / 0.6)); }   // 霞の奥からにじみ出る
    // 被弾の光と、探照灯に捉えられた照り
    p.flash = Math.max(0, p.flash - dt * 5);
    p.lit = Math.max(0, p.lit - dt * 2.5);
    { const f = Math.min(0.8, p.flash), l = p.lit * env.lit; p.mat.emissive.setRGB(Math.max(f, l * 0.7), Math.max(f * 0.6, l * 0.85), Math.max(f * 0.3, l)); }
    p.jolt *= Math.max(0, 1 - dt * 8);
    if (p.stuck) {
      // 槍に刺さって運ばれている
      p.stuckOff.multiplyScalar(Math.max(0, 1 - dt * 12));
      p.pos.copy(p.stuck.pos).add(p.stuckOff);
      p.mesh.position.copy(p.pos);
      p.mesh.rotation.z += dt * 2.5 * (p.ph > 5 ? 1 : -1);
      p.mesh.rotation.x += dt * 1.2;
      p.smokeT -= dt;
      if (p.smokeT <= 0) { p.smokeT = 0.03; fx.emit(p.pos, V(rand(-20, 20), rand(-20, 20), rand(-20, 20)), COL.fire, rand(10, 16), 0.3, { drag: 1, grow: 20 }); }
      continue;
    }
    if (p.falling) {
      p.fallT += dt;
      p.vel.y -= 90 * dt;
      p.roll += dt * (p.paper ? 6 : 1.4 + p.fallT * 1.6) * p.rollDir;
      p.pos.addScaledVector(p.vel, dt);
      p.mesh.rotation.z = p.roll;
      p.mesh.rotation.x = Math.min(1.0, p.fallT * 0.4);
      p.smokeT -= dt;
      if (!p.paper && p.smokeT <= 0) {
        p.smokeT = 0.03;
        fx.emit(p.pos, V(rand(-10, 10), rand(-10, 10), rand(-10, 10)), COL.fire, rand(10, 18) * p.size, 0.35, { drag: 1, grow: 20 });
        smoke.emit(p.pos, V(rand(-8, 8), rand(0, 12), rand(-8, 8)), COL.smoke, rand(12, 20) * p.size, rand(1.5, 2.5), { drag: 0.6, grow: 18, alpha: 0.6, grav: -6 });
      }
      if (p.pos.y < GROUND_Y + 5) { p.dead = true; if (!p.paper) crashAt(p.pos, p.boss ? 2 : 1); }
    } else {
      if (p.app > 0) {
        // 奥から滑り込んでくる（だんだん遅くなって、いつもの速さに落ち着く）
        const u0 = 1 - p.app;
        p.app = Math.max(0, p.app - dt / (def.n === 1 ? 1.1 : 2.6));
        const u1 = 1 - p.app;
        p.pos.z += FAR * ((1 - (1 - u1) ** 2) - (1 - (1 - u0) ** 2));
      } else p.pos.addScaledVector(p.vel, dt);
      if (p.jet) {
        tmpV2.set(p.pos.x, p.pos.y, p.pos.z + p.mesh.userData.tail * p.size);
        fx.emit(tmpV2, ZERO, COL.fire, 7 * p.size, 0.12, { drag: 0 });
        smoke.emit(tmpV2, V(rand(-3, 3), rand(-3, 3), 0), COL.vapor, 5 * p.size, 0.9, { drag: 0.3, grow: 9, alpha: 0.35 });
      }
      p.pos.y += Math.sin(st.t * 0.9 + p.ph) * 4 * dt;
      // くねり。戦闘機は速い周期で左右に振れ、上下にもうねる（画面の外までは出ない）
      if (p.zig) {
        const f = p.fighter ? 2.3 : 1.5;
        p.vel.x = Math.cos(st.t * f + p.ph) * p.zig - (p.fighter ? p.pos.x * 0.25 : 0);
      }
      if (p.wav && p.app <= 0) p.pos.y += Math.cos(st.t * 1.9 + p.ph * 1.7) * p.wav * dt;
      p.mesh.rotation.z = Math.sin(st.t * 0.7 + p.ph) * (p.paper ? 0.35 : 0.04) + p.jolt - (p.fighter ? p.vel.x * 0.006 : 0);
      // 機首の上げ下げ: 降下・上昇に合わせて傾き、掃射のあいだは撃つ先へ向ける
      p.aimT = Math.max(0, p.aimT - dt);
      const wantP = p.aimT > 0 ? p.aimPitch : p.fighter ? clamp(Math.atan2(-p.vel.y, p.vel.z), -0.5, 0.6) : 0;
      p.pitch += (wantP - p.pitch) * Math.min(1, dt * 7);
      p.yaw += ((p.aimT > 0 ? p.aimYaw : 0) - p.yaw) * Math.min(1, dt * 7);
      p.mesh.rotation.x = p.paper ? Math.sin(st.t * 2 + p.ph) * 0.15 : p.pitch;
      if (p.drops > 0 && p.app <= 0 && p.pos.z > p.dropZ) { dropBomb(p); p.drops--; p.dropZ += p.boss ? 110 : 160; }
      // 傷ついた機体は煙を引く
      if (p.hp < p.maxHp && !p.paper) {
        p.smokeT -= dt;
        if (p.smokeT <= 0) {
          p.smokeT = 0.07;
          tmpV2.set(p.pos.x + 18 * p.size * (p.ph > 5 ? 1 : -1), p.pos.y, p.pos.z + 6 * p.size);
          smoke.emit(tmpV2, V(rand(-4, 4), rand(0, 8), -20), COL.smoke, rand(7, 11) * p.size, rand(0.9, 1.5), { drag: 0.5, grow: 12, alpha: 0.5 });
          if (p.hp < p.maxHp * 0.5) fx.emit(tmpV2, V(0, 0, -10), COL.fire, rand(5, 8) * p.size, 0.2, { drag: 1 });
        }
      }
      // 戦闘機は近づくと町を機銃掃射する
      if (p.fighter && !p.away && p.app <= 0 && p.pos.z > -440) {
        // 30面からは高度を下げて屋根すれすれまで突っ込み、通りすぎたら上昇する
        if (def.n >= RAID_FROM && !p.dove) { p.dove = true; p.vel.y = (-(p.pos.y - 60) * p.vel.z) / Math.max(80, -p.pos.z - 150); }
        if (p.dove && p.pos.z > -150 && p.vel.y < 0) p.vel.y = 70;
        if (p.strafeN > 0 && (p.strafeT -= dt) <= 0) { p.strafeN--; p.strafeT = 0.45; strafe(p); }
      }
      if (!p.gone && (p.away ? p.pos.z < -1500 : p.pos.z > -50)) {   // 頭上を越えられた／逃げ切られた
        if (p.away) p.gone = true; else p.dead = true;   // 遠ざかる機体は、見えなくなるまで飛ばしておく
        p.bar?.remove(); p.bar = null;
        if (p.boss) st.bossEscaped = true;
        else if (!p.paper) damageCity(p.small ? 2 : p.fighter ? 2 : 6);
      }
      if (p.gone) { p.mesh.scale.setScalar(p.size * clamp(1 - (-p.pos.z - 1500) / 350, 0.001, 1)); if (p.pos.z < -1850) p.dead = true; }
    }
    p.mesh.position.copy(p.pos);
    p.mesh.rotation.y = p.away ? Math.PI : Math.atan2(p.vel.x, p.vel.z) * 0.6 + (p.falling ? 0 : p.yaw);
  }

  for (const b of bombs) {
    b.vel.y -= 60 * dt;
    b.pos.addScaledVector(b.vel, dt);
    b.mesh.position.copy(b.pos);
    b.mesh.lookAt(tmpV2.copy(b.pos).add(b.vel));
    b.mesh.rotateX(Math.PI / 2);
    b.trailT -= dt;
    if (b.trailT <= 0) { b.trailT = 0.04; fx.emit(b.pos, V(0, 8, 0), COL.red, 11, 0.22, { drag: 1 }); }
    if (b.split && b.vel.y < -58) {
      // 空中で三つに割れる
      b.dead = true;
      sparks(b.pos, 12);
      for (const sx of [-1, 0, 1]) dropBomb(b, V(sx * 30, 14, rand(-10, 10)));
      continue;
    }
    if (b.pos.y < GROUND_Y + 2) { b.dead = true; st.landed++; damageCity(def.g.has("bombs") ? (b.mesh.scale.x < 1 ? 4 : 7) : 9, b.pos); }
  }

  for (const s of spears) {
    s.prev.copy(s.pos);
    s.vel.y -= s.grav * dt;
    if (s.grav) s.vel.x += (def.wind || 0) * dt;
    s.pos.addScaledVector(s.vel, dt);
    s.life -= dt;
    s.age += dt;
    s.mesh.position.copy(s.pos);
    s.mesh.lookAt(tmpV2.copy(s.pos).add(s.vel));
    if (s.mesh.userData.cloth) s.mesh.userData.cloth.rotation.x = Math.sin(s.age * 18) * 0.35;   // 洗濯物がはためく
    if (s.spin) s.mesh.rotateX(s.age * s.spin);
    // 軌跡は1フレームの移動を刻んで、点線にならないようにする
    const tc = s.fire ? COL.fire : s.perfect ? COL.gold : s.ally ? COL.cyan : trailCol, ts = s.perfect ? 6 : s.ally ? 2.4 : 3.6;
    if (s.age > 0.05) for (let k = 0; k < 3; k++) fx.emit(tmpV2.copy(s.prev).lerp(s.pos, k / 3), ZERO, tc, ts, s.perfect ? 0.34 : 0.24, { drag: 0, alpha: 0.75 });
    if (s.kebab.length) { s.kebabT -= dt; if (s.kebabT <= 0) finale(s); }
    for (const t of planes) {
      if (s.life <= 0) break;
      if (!alive(t) || s.hitIds.has(t)) continue;
      if (segDist(s.prev, s.pos, t.pos) < 20 * t.size * s.radius) {
        s.hitIds.add(t);
        if (!s.ally && !s.storm) st.hits++;
        t.hp -= s.dmg * (t.lit > 0.5 ? 1.5 : 1);   // 探照灯に照らされた敵は脆い
        t.flash = 0.5;
        t.jolt = rand(-0.25, 0.25);
        sparks(hitPoint, 18);
        audio.hit();
        hitstop = Math.max(hitstop, s.ally ? 0 : 0.04);
        const more = s.pierce > 0;
        if (t.hp <= 0 || t.paper) {
          const canSkewer = !s.ally && !t.paper && !t.boss;
          const nxt = canSkewer && more ? nextSkewer(s, t) : null;
          if (canSkewer && (nxt || s.kebab.length)) {
            impale(t, s);
            if (nxt) steer(s, nxt); else finale(s);
          } else killPlane(t, s);
        } else {
          ensureBar(t);
          if (!more && !s.kebab.length && !s.mesh.userData.cloth && !s.spin) {
            // 刺さったまま残る
            s.mesh.position.copy(hitPoint);
            t.mesh.attach(s.mesh);
            s.kept = true;
            const stuck = t.mesh.userData.stuck;
            stuck.push(s.mesh);
            if (stuck.length > 10) t.mesh.remove(stuck.shift());
          }
        }
        s.pierce--;
        if (s.pierce < 0) s.life = 0;
      }
    }
    for (const b of bombs) {
      if (b.dead || s.life <= 0) continue;
      if (segDist(s.prev, s.pos, b.pos) < 13 * s.radius) {
        b.dead = true;
        st.stopped++;
        st.gain += 1;
        if (!s.storm) energy = Math.min(100, energy + 4);
        explosion(b.pos, 0.6);
        shockRing(b.pos, 90, 0x9fe8e0, 0.35);
        audio.boom(false, 0.7, 3);
        haptic(12);
        floatAt(b.pos, `${COIN}+1`, "#f2c46d", 18);
        updateObjective();
      }
    }
    if (s.pos.y < GROUND_Y) s.life = 0;
  }

  for (const arr of [planes, bombs]) for (let i = arr.length - 1; i >= 0; i--) if (arr[i].dead) { scene.remove(arr[i].mesh); arr[i].bar?.remove(); arr[i].mat?.dispose(); arr.splice(i, 1); }
  for (let i = spears.length - 1; i >= 0; i--) if (spears[i].life <= 0) {
    const s = spears[i];
    finale(s);
    if (!s.kept) scene.remove(s.mesh);
    spears.splice(i, 1);
  }

  st.comboT -= dt;
  if (st.comboT <= 0) $("combo").style.opacity = 0;
  fx.update(dt);
  smoke.update(dt);

  if (!st.over) {
    if (st.hp <= 0) endStage(false);
    else if (def.g.has("boss") && st.bossEscaped) endStage(false);
    else if (!st.queue.length && !planes.some((p) => !p.falling && !p.gone) && !bombs.length && !later.length) {
      if (def.g.has("bombs") && st.stopped < def.bombTarget && st.landed > 0) endStage(false);
      else endStage(true);
    }
  }
}

const hitPoint = new THREE.Vector3();
function segDist(a, b, p) {
  const ab = tmpV.copy(b).sub(a);
  const t = clamp(tmpV2.copy(p).sub(a).dot(ab) / Math.max(1e-6, ab.lengthSq()), 0, 1);
  return hitPoint.copy(a).addScaledVector(ab, t).distanceTo(p);
}

// ---------------- 結果・風刺ポスター ----------------
const SLOGANS = {
  3: ["竹槍一本\n大戦果", "見よ\n竹の底力", "落ちる時は\n落ちるのだ"],
  2: ["物干し竿も\n兵器である", "銭は\n明日の竹槍", "撃退すれども\n瓦は割れる"],
  1: ["辛うじて\n撃退", "竹は\n明日も伸びる", "町内会に\n報告せよ"],
  0: ["竹槍では\n間に合わぬ", "欲しいのは\n飛行機", "竹も\n品切れ"]
};
// 結果は「町内防空新報」の号外として刷る。右に縦の大見出し、左に版画ふうの絵、下に戦果の数字
function drawPoster(stars, stageNo) {
  const c = $("poster"), g = c.getContext("2d"), W = c.width, H = c.height;
  const win = stars > 0;
  const MIN = `"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif`;
  const INK = "#1d1916", RED = "#a8281e", PAPER = win ? "#eadfc4" : "#ddd2b8";
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.textAlign = "center"; g.textBaseline = "middle";
  // 紙
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  const vg = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75);
  vg.addColorStop(0, "rgba(120,90,40,0)"); vg.addColorStop(1, "rgba(120,90,40,0.28)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // 題字の帯（右から左へ読む）
  g.fillStyle = RED; g.fillRect(10, 10, W - 20, 38);
  g.fillStyle = "#f6ecd2"; g.font = `bold 25px ${MIN}`;
  [..."報新空防内町"].forEach((ch, i) => g.fillText(ch, 330 + i * 34, 30));
  g.fillStyle = INK; g.fillRect(540, 14, 44, 30);
  g.fillStyle = "#f6ecd2"; g.font = `bold 15px ${MIN}`; g.fillText("外號", 562, 30);
  g.font = `15px ${MIN}`; g.fillText(`第 ${stageNo} 面`, 70, 30);
  g.fillRect(120, 29, 180, 1.5);

  // 絵の枠（藍の夜空の版画）
  const X = 14, Y = 56, PW = 440, PH = 214;
  g.save();
  g.beginPath(); g.rect(X, Y, PW, PH); g.clip();
  const sky = g.createLinearGradient(0, Y, 0, Y + PH);
  sky.addColorStop(0, "#16223c"); sky.addColorStop(0.75, "#2c3d5e"); sky.addColorStop(1, win ? "#b8552e" : "#7a2a1c");
  g.fillStyle = sky; g.fillRect(X, Y, PW, PH);
  // 探照灯
  g.fillStyle = "rgba(235,228,200,0.16)";
  for (const [bx, tx, w] of [[70, 250, 60], [400, 190, 70], [250, 330, 46]]) { g.beginPath(); g.moveTo(X + bx, Y + PH); g.lineTo(X + tx - w, Y); g.lineTo(X + tx + w, Y); g.closePath(); g.fill(); }
  // 月
  g.fillStyle = "#efe6c8"; g.beginPath(); g.arc(X + 380, Y + 44, 22, 0, 7); g.fill();
  // 重爆（下から見上げた形）
  const bomber = (cx, cy, s, ang, col) => {
    g.save(); g.translate(cx, cy); g.rotate(ang); g.scale(s, s);
    g.fillStyle = col;
    g.beginPath(); g.moveTo(0, -66); g.bezierCurveTo(9, -60, 9, 40, 3, 62); g.lineTo(-3, 62); g.bezierCurveTo(-9, 40, -9, -60, 0, -66); g.fill();
    g.beginPath(); g.moveTo(-100, -2); g.lineTo(-8, -22); g.lineTo(8, -22); g.lineTo(100, -2); g.lineTo(100, 7); g.lineTo(8, 4); g.lineTo(-8, 4); g.lineTo(-100, 7); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-34, 50); g.lineTo(34, 50); g.lineTo(30, 60); g.lineTo(-30, 60); g.closePath(); g.fill();
    for (const x of [-60, -30, 30, 60]) { g.fillRect(x - 5, -30 + Math.abs(x) * 0.12, 10, 20); g.fillStyle = "rgba(255,255,255,0.22)"; g.beginPath(); g.ellipse(x, -33 + Math.abs(x) * 0.12, 15, 3, 0, 0, 7); g.fill(); g.fillStyle = col; }
    g.fillStyle = "rgba(0,0,0,0.28)"; g.beginPath(); g.ellipse(0, -52, 4.5, 9, 0, 0, 7); g.fill();
    g.restore();
  };
  const bamboo = (x0, y0, x1, y1, w) => {
    const L = Math.hypot(x1 - x0, y1 - y0), a = Math.atan2(y1 - y0, x1 - x0);
    g.save(); g.translate(x0, y0); g.rotate(a);
    g.fillStyle = "#6f8f34"; g.fillRect(0, -w / 2, L, w);
    g.fillStyle = "#a9c25a"; g.fillRect(0, -w / 2, L, w * 0.3);
    g.fillStyle = "#3d521a"; for (let d = 26; d < L; d += 38) g.fillRect(d, -w / 2 - 1.5, 4, w + 3);
    g.fillStyle = "#f3ecd4"; g.beginPath(); g.moveTo(L, -w / 2); g.lineTo(L + w * 2.6, 0); g.lineTo(L, w / 2); g.closePath(); g.fill();
    g.restore();
  };
  const burst = (cx, cy, r, n, col) => {
    g.fillStyle = col; g.beginPath();
    for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2, rr = i % 2 ? r * 0.5 : r * (0.85 + ((i * 7) % 5) * 0.06); g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    g.closePath(); g.fill();
  };
  if (win) {
    const n = Math.min(3, Math.max(1, st.skewerBest || 1));
    // 串刺しの数だけ、1本の槍に刺さっている
    const pts = n === 1 ? [[250, 96]] : n === 2 ? [[215, 124], [300, 70]] : [[190, 140], [258, 97], [326, 54]];
    pts.forEach(([px, py], i) => bomber(X + px, Y + py, 0.62 - i * 0.07, 0.9 + i * 0.25, "#d9d2bc"));
    bamboo(X + 60, Y + 224, X + (n === 1 ? 286 : 352), Y + (n === 1 ? 72 : 36), 9);
    pts.forEach(([px, py], i) => { burst(X + px + 6, Y + py - 4, 30 - i * 3, 9, "#c93a22"); burst(X + px + 6, Y + py - 4, 17 - i * 2, 7, "#f2b63c"); });
  } else {
    bomber(X + 150, Y + 80, 0.62, 0.1, "#cfc8b2");
    bomber(X + 290, Y + 104, 0.5, 0.1, "#bab39c");
    bomber(X + 380, Y + 136, 0.36, 0.1, "#a39c88");
    // 届かずに折れた竹槍
    bamboo(X + 70, Y + 214, X + 120, Y + 168, 8);
    g.save(); g.translate(X + 134, Y + 172); g.rotate(0.7); g.fillStyle = "#6f8f34"; g.fillRect(0, -4, 44, 8); g.restore();
  }
  // 屋根の影
  g.fillStyle = "#0f0d0c";
  for (let x = X - 10; x < X + PW; x += 34) {
    const h = 14 + ((x * 13) % 11);
    g.beginPath(); g.moveTo(x, Y + PH); g.lineTo(x, Y + PH - h + 8); g.lineTo(x + 17, Y + PH - h - 4); g.lineTo(x + 34, Y + PH - h + 8); g.lineTo(x + 34, Y + PH); g.closePath(); g.fill();
  }
  // 版画の網点
  g.fillStyle = "rgba(0,0,0,0.10)";
  for (let y = Y; y < Y + PH; y += 5) for (let x = X + ((y / 5) % 2) * 2.5; x < X + PW; x += 5) g.fillRect(x, y, 1.3, 1.3);
  g.restore();
  g.strokeStyle = INK; g.lineWidth = 2.5; g.strokeRect(X, Y, PW, PH);

  // 大見出し（縦書き、右から）
  const lines = pick(SLOGANS[stars]).split("\n");
  const longest = Math.max(...lines.map((l) => l.length));
  const fs = Math.min(46, Math.floor(206 / longest));
  g.fillStyle = win ? INK : RED;
  g.font = `900 ${fs}px ${MIN}`;
  lines.forEach((line, col) => [...line].forEach((ch, i) => g.fillText(ch, 558 - col * (fs + 12), 62 + fs / 2 + i * (fs + 2))));
  g.fillStyle = INK; g.fillRect(464, 56, 2, 214);

  // 戦果の欄
  const acc = st.shots ? Math.round(Math.min(1, st.hits / st.shots) * 100) : 0;
  const cells = [["撃墜", `${st.kills}機`], ["命中", `${acc}%`], ["串刺し", st.skewerBest >= 2 ? `${st.skewerBest}機` : "―"], ["連撃", `${st.maxCombo}`]];
  g.fillStyle = INK; g.fillRect(14, 278, W - 28, 2.5); g.fillRect(14, H - 12, W - 28, 1.5);
  cells.forEach(([k, v], i) => {
    const cx = 14 + ((W - 28) / 4) * (i + 0.5);
    g.fillStyle = INK; g.font = `14px ${MIN}`; g.fillText(k, cx - 34, 300);
    g.font = `900 25px ${MIN}`; g.fillText(v, cx + 22, 300);
    if (i) g.fillRect(14 + ((W - 28) / 4) * i, 286, 1, 28);
  });
  // 検閲の判子
  g.save();
  g.translate(408, 232); g.rotate(-0.22);
  g.strokeStyle = "rgba(196,44,32,0.9)"; g.fillStyle = "rgba(196,44,32,0.9)"; g.lineWidth = 3.5;
  g.beginPath(); g.arc(0, 0, 32, 0, 7); g.stroke();

}

function endStage(win) {
  st.over = true;
  st.win = win;
  setTimeout(() => {
    if (mode !== "play") return;
    const acc = st.shots ? st.hits / st.shots : 0;
    const hpR = st.hp / cityMax();
    let stars = 0;
    if (win) stars = 1 + (hpR >= 0.7 ? 1 : 0) + (hpR >= 0.95 && acc >= 0.5 ? 1 : 0);
    st.stars = stars;
    let gain, road = [];
    if (win) {
      gain = Math.round((st.gain + 3 + def.n) * (1 + 0.25 * (stars - 1)));
      save.stage = def.n + 1;
      save.best = Math.max(save.best, save.stage);
      road = grantRoad(def.n);
      rankSend();
      save.stars[def.n] = Math.max(save.stars[def.n] || 0, stars);
      delete save.fails[def.n];
      audio.clear();
    } else {
      gain = Math.floor(st.gain / 2);
      save.fails[def.n] = (save.fails[def.n] || 0) + 1;
      audio.fail();
    }
    st.final = gain;
    save.coins += gain;
    save.last = Date.now();
    persist();
    $("res-stage").textContent = `第${def.n}面`;
    $("res-title").textContent = win ? "撃退" : "突破";
    drawPoster(stars, def.n);
    [...$("stars").children].forEach((el, i) => { el.className = ""; if (i < stars) { void el.offsetWidth; el.className = "on"; setTimeout(() => audio.star(i), 250 * i + 120); } });
    $("stars").hidden = !win;
    $("res-gain").innerHTML = `${COIN}+${gain}`;
    $("res-double").hidden = !win || gain < 1;
    $("res-next").hidden = !win;
    $("res-retry").hidden = win;
    $("res-revive").hidden = win || st.revived;
    $("res-skip").hidden = win;
    $("res-road").hidden = !road.length;
    $("res-road").innerHTML = `解放　${road.join("　")}`;
    setMode("result");
  }, win ? 900 : 600);
}

function buyUpgrade(id, btn) {

// 仲間を雇う・出撃させる・育てる
function hireCrew(id) {

// 見た目は銭で引くくじ（ガチャ）で手に入れる。確率は画面に出す。かぶったら4割戻る
const RARE = ["並", "上", "極"], ODDS = [0.6, 0.3, 0.1];
const GACHA = { spear: 300, crew: 500 };
let lookKind = "spear", pulled = null;
function gacha(kind) {
  const list = kind === "spear" ? SKINS : CSKINS, cost = GACHA[kind];
  if (save.coins < cost) return false;
  save.coins -= cost;
  let x = Math.random(), r = 0;
  while (r < 2 && x >= ODDS[r]) x -= ODDS[r++];
  const pool = list.map((s, i) => i).filter((i) => i > 0 && list[i].r === r);
  const i = pick(pool), dup = save.own[kind].includes(i);
  if (dup) save.coins += Math.round(cost * 0.4);
  else { save.own[kind].push(i); if (kind === "spear") save.skin = i; else save.cskin = i; applySkin(); }
  pulled = { kind, i, dup, back: Math.round(cost * 0.4) };
  return true;
}
function renderLook() {
  const kind = lookKind, list = kind === "spear" ? SKINS : CSKINS, cur = kind === "spear" ? save.skin : save.cskin;
  const sw = (s) => (kind === "spear" ? "#" + new THREE.Color(s.c).multiply(new THREE.Color(0xb4c263)).getHexString() : "#" + (s.cloth ?? 0x7a5a6e).toString(16).padStart(6, "0"));

const trailCol = new THREE.Color(0x9fe8e0);
const ROAD = [
  { at: 3, nm: "祖母" }, { at: 6, nm: "祖父" }, { at: 8, coins: 100 }, { at: 10, nm: "子ども" }, { at: 12, coins: 200 }, { at: 15, nm: "消防団" },
  { at: 18, coins: 300 }, { at: 22, nm: "和尚" }, { at: 25, nm: "4人目" }, { at: 28, nm: "飛行兵" }, { at: 30, coins: 600 }, { at: 36, coins: 1000 },
  { at: 50, coins: 2000 }, { at: 75, coins: 4000 }, { at: 100, coins: 8000 }
];
// 100面より先も、25面ごとに銭が出る（長く遊ぶ人の道しるべ）
const roadAt = (i) => (i < ROAD.length ? ROAD[i] : { at: 100 + (i - ROAD.length + 1) * 25, coins: (100 + (i - ROAD.length + 1) * 25) * 100 });
const roadLabel = (r) => (r.coins ? `${COIN}${r.coins}` : r.nm);
function applySkin() {
  const s = SKINS[save.skin] || SKINS[0];
  spearMat.color.set(s.c);
  spearMat.emissive.set(s.e);
  trailCol.set(s.t);
  rebuildAllies();   // 人々の着替えも反映

// 第n面を越えたときにもらえるものを渡し、見出しの配列を返す
function grantRoad(n) {
  const got = [];
  while (roadAt(save.road).at <= n) {
    const r = roadAt(save.road++);
    if (r.coins) save.coins += r.coins;
    got.push(roadLabel(r));
  }
  return got;
}
function renderRoad() {
  const from = Math.max(0, save.road - 1);
  $("road").innerHTML = [0, 1, 2, 3].map((i) => {
    const k = from + i, r = roadAt(k);
    return `<div class="road-chip ${k < save.road ? "done" : k === save.road ? "next" : ""}"><b>${roadLabel(r)}</b>第${r.at}面</div>`;
  }).join("");
}

// ---------------- 毎日の配給と、留守のあいだの見張りの報酬 ----------------
let gift = null;
function checkGift() {
  const now = Date.now(), day = today();
  const lines = [];
  if (!save.day) { save.day = day; save.streak = 1; }   // 初めての起動は何も出さず、すぐ遊ばせる
  else if (save.day !== day) {
    save.streak = save.day === new Date(now - 864e5).toLocaleDateString("sv") ? Math.min(7, save.streak + 1) : 1;
    save.day = day;
    lines.push([`毎日の配給　${save.streak}日目`, 10 + save.streak * 10]);
  }
  const away = save.last ? (now - save.last) / 60000 : 0;
  if (away >= 10 && save.best > 1) lines.push(["見張りの報酬", Math.round(Math.min(480, away) * (0.15 + save.best * 0.03))]);
  save.last = now;
  persist();
  if (!lines.length) return;
  gift = { sum: lines.reduce((a, l) => a + l[1], 0) };
  $("gift-lines").innerHTML = lines.map(([t, n]) => `<div><span>${t}</span><span class="mono">${COIN}${n}</span></div>`).join("");
  $("gift-sum").innerHTML = `${COIN}+${gift.sum}`;
  $("gift-double").hidden = save.gift2 === day;
  $("gift").hidden = false;
}
function takeGift(mul) {
  if (!gift) return;
  save.coins += gift.sum * mul;
  if (mul > 1) save.gift2 = today();
  gift = null;
  persist();
  $("gift").hidden = true;
  audio.buy();
  refreshShops();
}

document.addEventListener("click", (e) => {

  if (!b || b.disabled) return;

  if (b.dataset.up) { buyUpgrade(b.dataset.up, b); return; }
  if (b.dataset.tab === "look") { pulled = null; sub = "look"; setMode("upgrade"); audio.ui(); return; }
  if (b.id === "rank-open") { sub = "rank"; setMode("upgrade"); rankLoad(); audio.ui(); return; }
  if (b.id === "rank-set") {
    save.name = [...$("rank-name").value.normalize("NFKC").replace(/\s+/g, " ").trim()].slice(0, 8).join("");
    persist(); $("rank-name").blur(); audio.buy(); rankLoad();
    return;
  }
  if (b.dataset.tab) { tab = b.dataset.tab; say = ""; refreshShops(); audio.ui(); return; }
  if (b.dataset.look) { lookKind = b.dataset.look; pulled = null; refreshShops(); audio.ui(); return; }
  if (b.id === "gacha-btn") {
    if (gacha(lookKind)) { persist(); audio.star(pulled.dup ? 0 : 1 + (lookKind === "spear" ? SKINS : CSKINS)[pulled.i].r); haptic(pulled.dup ? 10 : 40); }
    refreshShops();
    return;
  }
  if (b.dataset.hire || b.dataset.team || b.dataset.crewup || b.dataset.skin) {
    const ok = b.dataset.hire ? hireCrew(b.dataset.hire) : b.dataset.team ? toggleTeam(b.dataset.team) : b.dataset.crewup ? trainCrew(b.dataset.crewup) : pickSkin(...b.dataset.skin.split(":").map((v, i) => (i ? Number(v) : v)));
    persist();
    if (ok) { audio.buy(); haptic(10); } else audio.ui();
    rebuildAllies();
    refreshShops();
    return;
  }
  if (b.dataset.recall) {
    const a = allies[Number(b.dataset.recall)];
    if (a && recall(a)) { audio.buy(); haptic(15); } else audio.ui();
    return;
  }
  if (b.dataset.opt) {
    save.opt[b.dataset.opt] = !save.opt[b.dataset.opt];
    audio.setSound(save.opt.sound);
    persist(); refreshShops(); audio.ui(); haptic(15);
    return;
  }
  const a = b.dataset.action;
  if (b.id === "storm") return;   // 竹嵐は押した瞬間に撃つ（下の pointerdown）
  if (a === "start") {
    if (mode === "result" && !st.win) startStage(def.n);
    else startStage(save.stage);
  } else if (a === "next") {
    ads.interstitial(def.n);
    startStage(save.stage);
  } else if (a === "double") {
    ads.rewarded(() => { save.coins += st.final; persist(); $("res-gain").innerHTML = `${COIN}+${st.final * 2}`; $("res-double").hidden = true; refreshShops(); });
  } else if (a === "revive") {
    ads.rewarded(() => {
      save.coins -= st.final; // 負けで入った分は取り消して、続きから
      st.revived = true; st.over = false; st.hp = Math.ceil(cityMax() * 0.5); st.bossEscaped = false;
      if (def.g.has("boss") && !planes.some((p) => p.boss)) st.queue.push({ at: st.t + 1, kind: "boss" });
      if (def.g.has("bombs")) st.stopped = Math.max(st.stopped, def.bombTarget);
      for (const x of bombs) x.dead = true;
      st.ammo = ammoCap();
      persist();
      setMode("play");
    });
  } else if (a === "skip") {
    ads.rewarded(() => { save.stage = def.n + 1; persist(); startStage(save.stage); });
  } else if (a === "free") {
    if (freeLeft() > 0) ads.rewarded(() => { freeUp = true; refreshShops(); });
  } else if (a === "gift") takeGift(1);
  else if (a === "gift2") ads.rewarded(() => takeGift(2));
  else if (a === "lookback") setMode("menu");
  else if (a === "pause") setMode("pause");
  else if (a === "resume") setMode("play");
  else if (a === "menu") { clearWorld(); rebuildAllies(); applyEnv(MENU_DEF); setMode("menu"); }
  audio.ui();
});

    rt.style.opacity = th.style.opacity = 1;
    rt.style.left = input.ax + "px"; rt.style.top = input.ay + "px";
    th.style.left = input.x + "px"; th.style.top = input.y + "px";
    th.style.opacity = 0;
    const LEN = 2 * Math.PI * 36, [p0, p1] = perfectWin();
    rt.querySelector(".fg").setAttribute("stroke-dasharray", `${clamp(input.t / p1, 0, 1) * LEN} ${LEN}`);
    rt.querySelector(".pz").setAttribute("stroke-dasharray", `0 ${(p0 / p1) * LEN} ${(1 - p0 / p1) * LEN} ${LEN}`);
    rt.classList.toggle("perfect", input.t >= p0 && input.t <= p1);
    rt.classList.toggle("lock", !!pickTarget(input.ax, input.ay));
  } else rt.style.opacity = th.style.opacity = 0;
}

// ---------------- ループ ----------------
let last = 0, hudT = 0;
function frame(now) {
  const real = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
  last = now;
  measureFps(real);
  // 溜めている間は世界が少し遅くなる（集中）。撃墜の一瞬は止め、串刺しと竹嵐はゆっくり見せる
  focusK += ((input.charging && mode === "play" ? 0.62 : 1) - focusK) * Math.min(1, real * 10);
  if (mode === "play") {
    for (let i = later.length - 1; i >= 0; i--) if ((later[i].t -= real) <= 0) later.splice(i, 1)[0].fn();
    if (slowT > 0) slowT -= real;
  }
  if (hitstop > 0) { hitstop -= real; timeScale = 0.05; } else timeScale = (slowT > 0 ? slowK : 1) * focusK;
  update(real * timeScale, real);
  if (fovKick > 0.001 || camera.fov !== baseFov) {
    fovKick = Math.max(0, fovKick - real * 3.2);
    camera.fov = baseFov - fovKick * fovKick * 3.2;
    camera.updateProjectionMatrix();
  }

  const k = handSpear.userData.kick;
  handSpear.userData.kick = Math.max(0, k - real * 4);
  const pull = input.charging ? clamp(input.t / chargeFull(), 0, 1) : 0;
  handSpear.position.set(2.3, -3.3 - k * 1.2 + pull * 0.25, -5.6 + pull * 1.3 - k * 2.5);
  handSpear.visible = mode === "play" && (st.ammo > 0 || k > 0.2);
  shake = Math.max(0, shake - real * 30);
  const sway = mode !== "menu" && def?.g.has("roofmove") ? Math.sin(st.t * 0.55) * 44 : 0;
  homeRoof.position.x = sway;
  camera.position.set(rand(-1, 1) * shake * 0.4 + sway, rand(-1, 1) * shake * 0.3, 0);
  if (bolt > 0.002) { bolt *= Math.max(0, 1 - real * 5); skyMat.uniforms.uFlash.value = bolt; hemi.intensity = env.hemi + bolt * 3; }
  rainMat.uniforms.uTime.value = now / 1000;
  audio.music(planes.length);
  {
    let prop = 9999, jet = 9999;
    for (const p of planes) { if (p.falling || p.paper) continue; const d = Math.abs(p.pos.z); if (p.jet) jet = Math.min(jet, d); else prop = Math.min(prop, d); }
    audio.engine(clamp(1 - prop / 1500, 0, 1), clamp(1 - jet / 1300, 0, 1));
  }

  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= real;
    f.y -= real * 40;
    f.el.style.left = f.x + "px";
    f.el.style.top = f.y + "px";
    f.el.style.opacity = Math.min(1, (f.life / f.max) * 2);
    if (f.life <= 0) { f.el.remove(); floats.splice(i, 1); }
  }
  // 体力バー
  // 退避した仲間の「呼ぶ」ボタンを、その屋根の上に出す
  for (const a of allies) {
    if (!a.btn) continue;
    const s = mode === "play" ? screenOf(tmpV2.copy(a.root.position).add(tmpV.set(0, 9, 0))) : null;
    a.btn.style.display = s ? "" : "none";
    if (s) { a.btn.style.left = s.x + "px"; a.btn.style.top = s.y - (allies.indexOf(a) >= 2 ? 42 : 0) + "px"; a.btn.classList.toggle("can", save.coins + st.gain >= recallCost(a)); }
  }
  const bossP = mode === "play" ? planes.find((p) => p.boss && !p.falling) : null;
  $("boss-bar").hidden = !bossP;
  if (bossP) $("boss-fill").style.width = `${clamp(bossP.hp / bossP.maxHp, 0, 1) * 100}%`;
  for (const p of planes) {
    if (!p.bar) continue;
    const s = screenOf(tmpV2.copy(p.pos).add(V(0, 16 * p.size, 0)));
    if (!s) { p.bar.style.display = "none"; continue; }
    p.bar.style.display = "";
    p.bar.style.left = s.x + "px";
    p.bar.style.top = s.y + "px";
    p.bar.firstChild.style.width = `${clamp(p.hp / p.maxHp, 0, 1) * 100}%`;
  }
  if (bannerTimer > 0) { bannerTimer -= real; if (bannerTimer <= 0) $("banner").classList.remove("show"); }

  hudT += real;
  if (hudT > 0.05) { hudT = 0; updateHUD(); }
  fx.mat.uniforms.uScale.value = smoke.mat.uniforms.uScale.value = window.innerHeight * renderer.getPixelRatio() * 0.9;
  composer.render();
  requestAnimationFrame(frame);
}

// ---------------- 検証の約束 ----------------
if (DEBUG) {
  window.__test = {
    info: () => ({
      mode, wave: def ? def.n : save.stage, waves: null, gimmick: def ? def.names : null,
      hp: Math.ceil(st.hp ?? 0), score: Math.round(st.gain ?? 0), kills: st.kills ?? 0,
      shots: st.shots ?? 0, hits: st.hits ?? 0, ammo: st.ammo ?? 0, stars: st.stars ?? 0, coins: save.coins,
      fps: Math.round(fpsMeter.fps), quality
    }),
    // 押す位置（照準は押した位置の aimOffset() px 上に出るので、その分下を返す）
    targets: () => [...bombs, ...planes.filter((p) => !p.paper)]
      .filter(reach)
      .sort((a, b) => b.pos.z - a.pos.z)
      .map((t) => { const s = screenOf(t.pos); return s ? { x: s.x, y: s.y + aimOffset(), kind: t.boss ? "boss" : t.bomb ? "bomb" : "plane", z: Math.round(t.pos.z) } : null; })
      // 画面の外と、一時停止ボタンの上は押せない
      .filter((s) => s && s.x > 4 && s.x < innerWidth - 4 && s.y > 4 && s.y < innerHeight - 4 && !(s.x > innerWidth - 70 && s.y < 130)),
    perfectWindow: () => perfectWin(),
    // 面を直接始める（見た目の確認用）。ups で強化段数も上書きできる
    goto: (n, ups = {}) => {
      if (ups.crew) { Object.assign(save.crew, ups.crew); save.team = Object.keys(ups.crew).slice(0, 4); delete ups.crew; }
      Object.assign(save.up, ups); startStage(n); return def.names;
    },
    step: (sec) => { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60, 1 / 60); },
    storm: () => { energy = 100; beginStorm(); },
    // 機体を全部ならべて見る（形の確認用）
    show: (rx = 0, ry = 0) => {
      for (const m of (window.__shown || [])) scene.remove(m);
      window.__shown = Object.keys(MODELS).map((k, i) => {
        const m = buildBomber(k);
        m.scale.setScalar(k === "bomber" ? 0.42 : 1);
        m.position.set((i % 4 - 1.5) * 40, 68 - Math.floor(i / 4) * 30, -120);
        m.rotation.set(rx, ry, 0);
        scene.add(m);
        return m;
      });
    },
    raid: () => { const a = allies.find((x) => !x.out); if (a) retreat(a); return allies.map((x) => x.kind + (x.out ? ":退避" : "")); },
    // 強化を安い順に買う（ボットの成長を人に近づけるため）
    buyCheapest: () => {
      // 雇える仲間がいれば先に雇う（人の遊び方に近づけ、仲間の動きも検証に乗せる）
      const hire = CREW.find((c) => !crewLv(c.id) && save.best > c.at && save.coins >= c.cost);
      if (hire && hireCrew(hire.id)) { persist(); refreshShops(); return "hire:" + hire.id; }
      const can = UPS.filter((u) => !(u.max != null && L(u.id) >= u.max) && save.coins >= upCost(u)).sort((a, b) => upCost(a) - upCost(b));
      if (!can.length) return null;
      const btn = document.querySelector(`[data-up="${can[0].id}"]`);
      buyUpgrade(can[0].id, btn);
      return can[0].id;
    }
  };
}

applyQuality();
applySkin();
applyEnv(MENU_DEF);
rebuildAllies();
setMode("menu");
checkGift();
requestAnimationFrame(frame);
</script>
</body>
